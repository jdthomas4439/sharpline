name: Update Sharpline data
on:
  schedule:
    - cron: "17 * * * *"   # every hour, 17 minutes past
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_EVERY_HOURS: "6"
        run: python scripts/update.py
      - name: Save data
        run: |
          git config user.name "sharpline-bot"
          git config user.email "sharpline-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push && break; sleep 5; done

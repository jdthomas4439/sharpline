name: Update Sharpline data
on:
  schedule:
    - cron: "17 * * * *"   # every hour, 17 minutes past (cron-job.org also starts it every 30 minutes)
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # always start from the newest data, even if this run was queued behind another one
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SHARPAPI_KEY: ${{ secrets.SHARPAPI_KEY }}
        run: python scripts/update.py
      - name: Save data
        run: |
          git config user.name "sharpline-bot"
          git config user.email "sharpline-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            # if another run saved first, keep this (newer) run's data where the two differ
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Could not save the data after 3 tries"
          exit 1

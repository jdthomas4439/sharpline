function renderParlay(){
  if (!slip.length){
    view.innerHTML = `<h1>Your slip</h1><div class="slip"><div class="empty">No bets yet. Add prices from Edges, Odds or Props to build a single or a parlay. You can mix NBA and NHL.<br><button class="primary" id="goEdges">See today’s edges</button></div></div>`;
    document.getElementById("goEdges").onclick = () => go("edge");
    return;
  }
  const payDec = slip.reduce((a,l) => a*dec(l.odds), 1);
  const trueP = slip.reduce((a,l) => a*l.prob, 1);
  const ev = trueP*payDec - 1;
  const sameGame = new Set(slip.map(l=>l.gid)).size < slip.length;
  view.innerHTML = `
    <h1>${slip.length > 1 ? slip.length + "-leg parlay" : "Single bet"}</h1>
    <p class="sub">Compares what the book pays to what the fair odds say it should pay.</p>
    <div class="slip">
      ${slip.map((l,i) => `<div class="leg"><div class="txt">${l.side}<small>${l.type} at ${BOOK_NAMES[l.book]}, ${matchup(gameById(l.gid))}</small></div><span class="o">${fmt(l.odds)}</span><button class="x" data-rm="${i}" aria-label="Remove ${l.side}">×</button></div>`).join("")}
      <div class="calc">
        <div><small>Book pays</small><b>${fmt(toAm(payDec))}</b></div>
        <div><small>Fair odds</small><b>${fmt(toAm(1/trueP))}</b></div>
        <div><small>Hit chance</small><b>${(trueP*100).toFixed(1)}%</b></div>
        <div><small>Expected value</small><b style="color:${ev>=0?"var(--pos)":"var(--neg)"}">${pct(ev)}</b></div>
      </div>
      <div class="stake"><label for="stk">Stake $</label><input id="stk" type="number" min="1" value="${stake}"><span>To win <b class="num" id="towin" style="font-size:20px">$${(stake*(payDec-1)).toFixed(2)}</b></span></div>
    </div>
    ${ev < 0 ? `<div class="warn">This slip is priced against you. The book is keeping about ${(Math.abs(ev)*100).toFixed(0)}% of every dollar long term.</div>` : ""}
    ${sameGame ? `<div class="warn">Legs from the same game can be correlated. Books price same-game parlays differently, so the fair odds here are an estimate.</div>` : ""}
    <p style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="primary" id="logSlip">Log this bet</button><button class="chip" id="shareBtn">Share to feed</button><button class="chip" id="clearBtn">Clear slip</button></p>`;
  view.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { slip.splice(+b.dataset.rm,1); updateBadge(); renderParlay(); });
  document.getElementById("stk").oninput = e => { stake = Math.max(0, +e.target.value||0); document.getElementById("towin").textContent = "$" + (stake*(payDec-1)).toFixed(2); };
  document.getElementById("clearBtn").onclick = () => { slip = []; updateBadge(); renderParlay(); };
  document.getElementById("logSlip").onclick = () => { logBet(slip.map(legFromSlip), stake, slip[0].book); slip = []; updateBadge(); toast("Bet logged. Track it on the Bets tab."); render(); };
  document.getElementById("shareBtn").onclick = () => toast("Shared to your followers");
}

function renderSocial(){
  view.innerHTML = `
    <h1>My bets</h1>
    <p class="sub">Saved on this device. Bets on games in the app’s data settle automatically, and spread and total bets show how your number compares with the closing line.</p>
    ${systemTestHTML()}
    <h2>Your bets</h2>
    ${trackerHTML()}
    <h2>Community preview</h2>
    <p class="note">The leaderboard and feed below use sample picks to show the layout.</p>
    <h2>Leaderboard this month</h2>
    <div class="lb">${LEADERS.map((l,i) => `<div class="lb-row"><span class="rank">${i+1}</span><div class="av" style="background:${l.c}">${l.n[0]}</div><div class="n">${l.n}<small>${l.rec}, CLV ${l.clv}</small></div><span class="roi">${l.roi}</span></div>`).join("")}</div>
    <p class="note">Ranked by ROI with a 50-bet minimum. Closing line value shows who beats the market, not just who got lucky.</p>
    <h2>Feed</h2>
    ${POSTS.map((p,i) => {
      const g = gameById(p.game);
      return `<article class="post">
        <div class="post-head"><div class="av" style="background:${p.c}">${p.user[0].toUpperCase()}</div>
          <div class="n">${p.user}${p.ver ? '<span class="ver">Verified</span>' : ""}<small>${p.rec}, ${p.ago} ago</small></div></div>
        <div class="pick"><b>${p.side}</b><span class="note">${p.type}, ${matchup(g)}, ${BOOK_NAMES[p.book]}</span><span class="o">${fmt(p.odds)}</span></div>
        <p>${p.text}</p>

      </article>`;
    }).join("")}
    <p class="rg">Bet with limits you set ahead of time. Need a break? Call 1-800-GAMBLER.</p>`;
  wireTracker();
  const sm = document.getElementById("sysMore"); if (sm) sm.onclick = () => { sysOpen = !sysOpen; renderSocial(); };
  view.querySelectorAll("[data-tail]").forEach(b => b.onclick = () => {
    const p = POSTS[+b.dataset.tail];
    addLeg(p.game, p.type, p.side, p.book, p.odds, sideProb(p.game, p.side) ?? imp(p.odds));
  });
  view.querySelectorAll("[data-fade]").forEach(b => b.onclick = () => toast("Fade adds the other side in the live version"));
  view.querySelectorAll("[data-c]").forEach(b => b.onclick = () => toast("Comments open in the live version"));
}

const RENDER = { top:renderTop, edge:renderEdge, odds:renderOdds, props:renderProps, markets:renderMarkets, parlay:renderParlay, social:renderSocial };
function render(){
  const bar = document.querySelector(".sport-bar"); if (bar) bar.hidden = current === "top";
  RENDER[current]();
  if (current === "edge" && window.SLB && SLB.HISTORY){ const M = lineMoves(); if (M.length) store.set("sl_moves_seen", Math.max(movesSeen(), M[0].ts)); }
  updateMoveBadge(); updateBadge();
}
function go(t){
  current = t;
  const bar = document.querySelector(".sport-bar"); if (bar) bar.hidden = t === "top";
  document.querySelectorAll(".tab").forEach(b => { b.classList.toggle("on", b.dataset.tab === t); b.setAttribute("aria-current", b.dataset.tab === t ? "page" : "false"); });
  render(); window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => go(b.dataset.tab));
function setSport(sp){
  sport = sp; gameFilter = "all"; teamFilter = "both"; openKey = null; movesAll = false;
  if (DATA[sport]) statFilter = DATA[sport].stats[sport === "nhl" ? 3 : 0];
  if (CFG[sport]){
    LIVE = LIVE_BY[sport]; liveGame = "all"; liveOpen = null; liveStat = Object.values(CFG[sport].markets)[0];
    const hosted = window.SLB && SLB.ODDS && SLB.ODDS[sport];
    if (((apiKey && mcpNs) || hosted) && !LIVE.games && !LIVE.loading) loadLines();
  }
  document.querySelectorAll("[data-sport]").forEach(x => { x.classList.toggle("on", x.dataset.sport === sp); if (x.dataset.sport === sp) x.scrollIntoView({ inline:"nearest", block:"nearest" }); });
  render(); window.scrollTo(0,0);
}
document.querySelectorAll("[data-sport]").forEach(b => b.onclick = () => setSport(b.dataset.sport));
document.getElementById("slipPill").onclick = () => go("parlay");

let tt;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1800);
}
/* start on Top, with the sport bar set to a sport that has games today */
(() => {
  const order = ["nfl","cfb","nba","nhl","ncaab","soccer","mlb"], today = etDate(new Date());
  const pick = order.find(sp => RES[sp] && freeGames(sp).some(g => etDate(g.start) === today && !g.started)) || order.find(sp => RES[sp] && freeGames(sp).length) || sport;
  if (pick !== sport){
    sport = pick;
    if (DATA[sport]) statFilter = DATA[sport].stats[sport === "nhl" ? 3 : 0];
    if (CFG[sport]){ LIVE = LIVE_BY[sport]; liveStat = Object.values(CFG[sport].markets)[0]; }
    document.querySelectorAll("[data-sport]").forEach(x => x.classList.toggle("on", x.dataset.sport === sport));
  }
})();
/* phones resume a home-screen app where it was left: after 10+ minutes away, reload so it opens fresh on Top with new data */
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => { if (document.hidden) hiddenAt = Date.now(); else if (hiddenAt && Date.now() - hiddenAt > 10 * 60000) location.reload(); });
window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });
render();
</script>

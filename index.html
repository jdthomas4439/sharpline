<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HedgehogBets</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 240 160%22%3E%3Crect width=%22240%22 height=%22160%22 rx=%2224%22 fill=%22%230E1014%22/%3E%3Cpath d=%22M42 78h10v32H42zM58 68h10v42H58zM74 56h10v54H74zM90 46h10v64H90zM106 34h10v76h-10zM122 24h10v86h-10zM138 12h10v98h-10z%22 fill=%22%2333D17A%22/%3E%3Cpath d=%22M30 114h146l46 14-46 14H44q-16 0-16-14z%22 fill=%22%23E9ECEF%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#0E1014">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HedgehogBets">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface2:#EDF0F3; --ink:#0E1014; --muted:#5A6472; --line:#DCE1E7; --pos:#138A4B; --pos-bg:#DDF3E6; --neg:#C23B3B; --gold:#8F6200; --gold-bg:#FCEFCB; --brand:#138A4B; --brand-ink:#FFFFFF; --best-bg:#DDF3E6; --best-line:#138A4B;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1014; --surface:#161A21; --surface2:#1C212A; --ink:#E9ECEF; --muted:#A3ACB8; --line:#262B34; --pos:#33D17A; --pos-bg:#12301F; --neg:#FF7A7A; --gold:#F4B740; --gold-bg:#3A2D0E; --brand:#33D17A; --brand-ink:#0E1014; --best-bg:#12301F; --best-line:#33D17A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#161A21; --surface2:#1C212A; --ink:#E9ECEF; --muted:#A3ACB8; --line:#262B34; --pos:#33D17A; --pos-bg:#12301F; --neg:#FF7A7A; --gold:#F4B740; --gold-bg:#3A2D0E; --brand:#33D17A; --brand-ink:#0E1014; --best-bg:#12301F; --best-line:#33D17A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.num,.cond{font-family:"Archivo",sans-serif;font-stretch:75%;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:720px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1}
.logo b{color:var(--pos);font-weight:700}.emblem{width:38px;height:26px;display:block}
.sport-bar{border-top:1px solid var(--line)}
.sport-row{max-width:720px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:4px 12px;font-size:14px;font-weight:600}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip[disabled]{opacity:.45;cursor:not-allowed}

main{max-width:720px;margin:0 auto;padding:16px 16px 110px}
h1{font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.15;margin:4px 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:16px}
.note{font-size:14px;color:var(--muted)}

.summary{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:18px;overflow:hidden}
.summary div{padding:10px 12px;border-right:1px solid var(--line)}
.summary div:last-child{border-right:0}
.summary b{display:block;font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:20px;line-height:1}
.summary small{color:var(--muted);font-size:14px}

.edge{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pos);border-radius:6px;margin-bottom:10px}
.edge .what{font-weight:600}
.edge .meta{color:var(--muted);font-size:14px}
.edge .ev{font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;color:var(--pos);text-align:right;line-height:1}
.edge .right{text-align:right}
.edge .row2{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
.edge .row2 strong{color:var(--ink);font-weight:600}
.add{margin-left:auto;border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:6px;padding:4px 10px;font-weight:600;font-size:14px}

.game{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.game-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.game-head .teams{font-weight:600}
.game-head .time{color:var(--muted);font-size:14px}
.spark{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.spark svg{display:block}
.mk{padding:8px 14px 12px}
.mk-title{font-size:14px;color:var(--muted);margin:2px 0 6px}
.board-wrap{overflow-x:auto}
table.board{border-collapse:collapse;width:100%;min-width:440px}
.board th{font-weight:500;font-size:14px;color:var(--muted);text-align:center;padding:4px 2px}
.board th:first-child{text-align:left}
.board td{padding:3px 2px;text-align:center}
.board td:first-child{text-align:left;font-weight:600;white-space:nowrap;padding-right:8px}
.cell{width:100%;min-width:54px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:5px 0;font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.cell.best{background:var(--best-bg);border-color:var(--best-line);color:var(--ink)}
.cell.picked{outline:2px solid var(--brand)}
.fair{font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:16px;color:var(--muted);font-style:italic}

.prop{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.prop-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.prop-top .who{font-weight:600}
.prop-top .line{font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;margin-left:auto}
.bars{display:flex;align-items:flex-end;gap:4px;height:64px;margin:10px 0 4px;position:relative}
.bar{flex:1;border-radius:6px 3px 0 0;background:var(--line);position:relative}
.bar.hit{background:var(--pos)}
.bar span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums}
.lineMark{position:absolute;left:0;right:0;border-top:2px dashed var(--gold)}
.prop-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:8px;align-items:center}
.prop-stats b{color:var(--ink);font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:14px}
.tag{font-size:14px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--pos-bg);color:var(--pos)}
.tag.neutral{background:var(--surface2);color:var(--muted)}

.slip{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.leg{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.leg .txt{flex:1}
.leg .txt small{display:block;color:var(--muted);font-size:14px}
.leg .o{font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;padding:0 4px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
.calc div{padding:10px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.calc div:nth-child(2n){border-right:0}
.calc small{display:block;color:var(--muted);font-size:14px}
.calc b{font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:20px}
.stake{display:flex;align-items:center;gap:10px;padding:12px 14px}
.stake input{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);font:inherit;font-size:16px}
.warn{margin:12px 0 0;padding:10px 12px;border-radius:6px;background:var(--gold-bg);color:var(--ink);font-size:14px}
.primary{background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:10px 16px;font-weight:600}

.me{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.me div{padding:10px 8px;text-align:center;border-right:1px solid var(--line)}
.me div:last-child{border-right:0}
.me b{display:block;font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:20px;line-height:1.1}
.me small{color:var(--muted);font-size:12px}
h2{font-weight:600;font-size:20px;letter-spacing:-.01em;margin:22px 0 8px}
.lb{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:6px}
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:0}
.rank{font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;width:22px;color:var(--muted)}
.lb-row .n{flex:1;font-weight:600}
.lb-row .n small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.lb-row .roi{font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:16px;color:var(--pos)}
.post{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.post-head{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:16px;flex-shrink:0}
.post-head .n{font-weight:600}
.post-head .n small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.ver{font-size:12px;font-weight:600;color:var(--pos);border:1px solid var(--pos);border-radius:6px;padding:0 5px;margin-left:4px}
.pick{margin:10px 0 6px;padding:10px 12px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick b{font-weight:600}
.pick .o{font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;margin-left:auto}
.post p{margin:6px 0 10px;font-size:16px}
.post-actions{display:flex;gap:8px}
.post-actions button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 12px;font-size:14px;font-weight:600}
.post-actions .tail{border-color:var(--brand);color:var(--brand)}
.rg{margin-top:24px;font-size:14px;color:var(--muted);text-align:center}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:transparent;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--neg);color:#fff;border-radius:12px;font-size:12px;min-width:17px;height:17px;line-height:17px;padding:0 4px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:-4px 0 14px}
.filters .chip{white-space:nowrap}
.trends{padding:8px 14px 10px;border-bottom:1px solid var(--line);background:var(--surface2);margin:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.trends li{font-size:14px;display:flex;gap:8px;align-items:baseline}
.trends li::before{content:"";width:7px;height:7px;border-radius:6px;background:var(--gold);flex-shrink:0;transform:translateY(-1px)}
.trends li.div::before{background:var(--brand)}
.hist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.hist div{background:var(--surface2);border-radius:6px;padding:6px 8px;position:relative;overflow:hidden}
.hist small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.hist b{font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:16px}
.hist em{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px}
.hist i{position:absolute;left:0;bottom:0;height:3px;background:var(--pos)}
.hist i.low{background:var(--neg)}
.hist div.na{opacity:.5}
.model{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.model b{color:var(--ink);font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:14px}
.tag.under{background:var(--gold-bg);color:var(--gold)}

.listbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:0 0 8px}
.sortby{display:flex;gap:6px;align-items:center}
.sortby .chip{padding:2px 10px;font-size:14px}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.phead,.prow{display:grid;grid-template-columns:minmax(0,1fr) 40px 44px 50px 74px;gap:6px;align-items:center;padding:8px 12px}
.phead{font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface2)}
.phead span:not(:first-child),.prow>span:not(:first-child){text-align:center}
.prow{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line)}
.prow.open{background:var(--surface2)}
.pn{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.prow .num{font-size:20px}
.prow .pl{font-weight:700}
.prow .good{color:var(--pos)} .prow .bad{color:var(--neg)}
.ptag{font-size:14px;font-weight:600;padding:2px 4px;border-radius:6px;background:var(--pos-bg);color:var(--pos);white-space:nowrap}
.ptag.under{background:var(--gold-bg);color:var(--gold)}
.ptag.none{background:transparent;color:var(--muted)}
.pdetail{padding:6px 12px 14px;border-bottom:1px solid var(--line);background:var(--surface2)}
.pdetail .hist div{background:var(--surface)}

.livebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:6px;padding:10px 12px;margin:6px 0 14px}
.livebar.err{border-left-color:var(--neg)}
.livebar b{display:flex;align-items:center;gap:6px;font-weight:600}
.livebar span{display:block;font-size:14px;color:var(--muted)}
.livebar .dot{width:8px;height:8px;border-radius:50%;background:var(--pos);display:inline-block}
.keyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.keyrow input{width:200px;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);font:inherit;font-size:16px}
.primary[disabled]{opacity:.5;cursor:default}
.inplay{color:var(--neg);font-weight:600}
.phead.lp,.prow.lp{grid-template-columns:minmax(0,1fr) 36px 56px 56px 70px}
.pn small b{font-weight:600}.pn small b.good{color:var(--pos)}.pn small b.bad{color:var(--neg)}
.bk{display:block;font-size:12px;color:var(--muted);font-family:"Archivo",sans-serif;line-height:1}
.pdetail .board .cell{min-width:46px;font-size:16px}

.ttbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}
.ttwrap{padding:8px 14px 12px;border-bottom:1px solid var(--line)}
.ttteam{margin-bottom:12px}
.ttname{font-weight:600;margin:4px 0 6px}
.mut{color:var(--muted);font-weight:400}
table.tt{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}
.tt th{font-weight:500;font-size:12px;color:var(--muted);text-align:center;padding:4px;border-bottom:1px solid var(--line)}
.tt td{text-align:center;padding:6px 4px;border-bottom:1px solid var(--line);font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:14px}
.tt td:first-child{text-align:left;font-family:"Archivo",sans-serif;font-size:14px}
.tt td small{display:block;color:var(--muted);font-size:12px}
.tt b{font-weight:600}.tt b.good{color:var(--pos)}.tt b.bad{color:var(--neg)}
.h2h{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:8px}
.h2h div{display:grid;grid-template-columns:96px 1fr auto;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:14px}
.h2h div:last-child{border-bottom:0}
.h2h span:first-child{color:var(--muted)}
.trends.angles{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.trends.angles small{display:block;color:var(--muted);font-size:12px}
.trends.angles li{align-items:flex-start}

.cons{display:grid;grid-template-columns:1fr 1fr 1.6fr;border-bottom:1px solid var(--line)}
.cons div{padding:8px 14px;border-right:1px solid var(--line)}
.cons div:last-child{border-right:0}
.cons small{display:block;color:var(--muted);font-size:12px}
.cons b{font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.h2h small{font-size:12px}

.tester{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.tester label{display:flex;gap:6px;align-items:center;font-size:14px}
.tester input{width:82px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);font:inherit;font-size:16px}

.sport-row::-webkit-scrollbar{display:none}
.sport-row .chip{white-space:nowrap;flex-shrink:0}

.bets{display:flex;flex-direction:column;gap:8px}
.bet{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:6px;padding:10px 12px}
.bet.win{border-left-color:var(--pos)}.bet.loss{border-left-color:var(--neg)}.bet.push{border-left-color:var(--muted)}
.btop{display:flex;gap:8px;align-items:baseline}
.btop b{flex:1;font-weight:600}
.btop .o{font-family:"Archivo",sans-serif;font-stretch:75%;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.bst{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* ---------- Odds math ---------- */
const dec = a => a > 0 ? 1 + a/100 : 1 + 100/(-a);
const imp = a => 1/dec(a);
const fmt = a => (a > 0 ? "+" : "") + a;
const toAm = d => d >= 2 ? Math.round((d-1)*100) : -Math.round(100/(d-1));
const pct = x => (x >= 0 ? "+" : "") + (x*100).toFixed(1) + "%";
const BANKROLL = 1000;

function fairProbs(m){
  if (m.sides.every(s => s.sharp != null)){
    const p = m.sides.map(s => imp(s.sharp)), t = p.reduce((a,b)=>a+b,0);
    return p.map(x => x/t);
  }
  const acc = m.sides.map(() => 0); let n = 0;
  BOOKS.forEach(b => {
    if (m.sides.some(s => s.odds[b] == null)) return;
    const p = m.sides.map(s => imp(s.odds[b])), t = p.reduce((a,c)=>a+c,0);
    p.forEach((x,i) => acc[i] += x/t); n++;
  });
  return n ? acc.map(x => x/n) : m.sides.map(() => 1/m.sides.length);
}
const ALL_GAMES = [...DATA.nba.games, ...DATA.nhl.games];
var LIVE_REF = null;
const gameById = id => ALL_GAMES.find(g => g.id === id) || (LIVE_REF ? Object.values(LIVE_REF).flatMap(L => L.games || []) : []).find(g => g.id === id) || (String(id).startsWith("fr_") ? freeGames(String(id).split("_")[1]).find(g => g.id === id) : undefined);

function allEdges(sport){
  const out = [];
  getGames().filter(g => !g.started).forEach(g => g.markets.forEach(m => {
    const fp = fairProbs(m);
    m.sides.forEach((s,i) => BOOKS.forEach(b => {
      const o = s.odds[b]; if (o == null) return;
      const ev = fp[i]*dec(o) - 1;
      if (ev > 0.004){
        const bb = dec(o)-1, kelly = Math.max(0,(bb*fp[i] - (1-fp[i]))/bb) / 4;
        out.push({ g, m, s, book:b, odds:o, ev, prob:fp[i], fair:toAm(1/fp[i]), stake:Math.round(kelly*BANKROLL) });
      }
    }));
  }));
  return out.sort((a,b) => b.ev - a.ev);
}

/* Prop model: blends hit rates across splits, then shrinks toward the no-vig market price */
function propModel(p){
  const parts = [
    [p.l10.filter(v => v > p.line).length / 10, .30],
    [p.ssn[0]/p.ssn[1], .30],
    p.vs && p.vs[1] >= 3 ? [p.vs[0]/p.vs[1], .20] : null,
    p.div ? [p.div[0]/p.div[1], .05] : null,
    [p.loc[0]/p.loc[1], .10],
    [p.rest[0]/p.rest[1], .05]
  ].filter(Boolean);
  const w = parts.reduce((a,x)=>a+x[1],0);
  const hist = parts.reduce((a,x)=>a+x[0]*x[1],0)/w;
  const po = imp(p.o), pu = imp(p.u), mkt = po/(po+pu);
  const model = 0.55*hist + 0.45*mkt;
  const evO = model*dec(p.o) - 1, evU = (1-model)*dec(p.u) - 1;
  let lean = null;
  if (evO > 0.03 && evO >= evU) lean = { side:"Over", ev:evO, odds:p.o, book:p.ob, prob:model };
  else if (evU > 0.03) lean = { side:"Under", ev:evU, odds:p.u, book:p.ub, prob:1-model };
  return { hist, mkt, model, lean };
}

function rngFor(str){ let h = 1779033703 ^ str.length; for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; }
  return function(){ h = Math.imul(h ^ h>>>16, 2246822507); h = Math.imul(h ^ h>>>13, 3266489909); h ^= h>>>16; return (h>>>0)/4294967296; }; }

function probOver(line, l){ let s = 0, t = Math.exp(-l); for (let k=0;k<=Math.floor(line);k++){ s += t; t *= l/(k+1); } return 1-s; }

  return out;
}

function makeProp(r, o){
  const { lam } = o;
  const line = lam < 1.2 ? 0.5 : Math.floor(lam - 0.25) + 0.5;
  const pT = probOver(line, lam);
  const pick = (g, sd) => Math.round(g * clamp(pT + (r()-0.5)*2*sd, 0.03, 0.97));
  const sG = 55 + Math.floor(r()*25), vG = 4 + Math.floor(r()*7), lG = 28 + Math.floor(r()*13), rG = 6 + Math.floor(r()*10);
  const pm = clamp(pT + (r()-0.5)*0.1, 0.06, 0.94);
  return { p:o.p, g:o.g, opp:o.opp, home:o.home, s:o.s, pos:o.pos, line,
    o:round5(toAm(1/(pm*1.045))), ob:BOOKS[Math.floor(r()*4)], u:round5(toAm(1/((1-pm)*1.045))), ub:BOOKS[Math.floor(r()*4)],
    proj:+(lam*(0.92 + r()*0.16)).toFixed(1),
    l10:Array.from({length:10}, () => poisson(lam, r)),
    ssn:[pick(sG,.05), sG], vs:[pick(vG,.15), vG, +(lam*(0.85+r()*0.3)).toFixed(1)],
    div:o.div ? [pick(24,.08), 24] : null, loc:[pick(lG,.07), lG], rest:[pick(rG,.12), rG, o.rest] };
}

  if (Array.isArray(p)) return p;
  if (p && p.id) return [p];
  throw { code:"tool_error", message:"Unexpected response from The Odds API." };
}

function mostCommon(arr){ const c = {}; arr.forEach(x => c[x] = (c[x]||0)+1); return Object.keys(c).sort((a,b) => c[b]-c[a])[0]; }
const fmtPt = x => (x > 0 ? "+" : "") + x;

function toGame(ev, sp){
  const C = CFG[sp];
  const away = ev.away_team, home = ev.home_team, start = new Date(ev.commence_time);
  const mk = {}; let sharp = {};
  ev.bookmakers.forEach(b => {
    const k = BOOK_KEYS[b.key];
    b.markets.forEach(m => { if (k) (mk[m.key] = mk[m.key] || {})[k] = m.outcomes; if (b.key === "pinnacle") sharp[m.key] = m.outcomes; });
  });
  const markets = [];
  if (mk.h2h){
    const side = name => ({ name:nick(name), odds:Object.fromEntries(Object.entries(mk.h2h).map(([k,o]) => [k, (o.find(x => x.name === name)||{}).price])), sharp:(sharp.h2h||[]).find(x => x.name === name)?.price ?? null });
    markets.push({ type:"Moneyline", sides:[side(away), side(home)] });
  }
  if (mk.spreads){
    const pts = Object.values(mk.spreads).map(o => (o.find(x => x.name === away)||{}).point).filter(x => x != null);
    const pt = +mostCommon(pts);
    if (!isNaN(pt)){
      const pick = (name, p, src) => { const o = (src||[]).find(x => x.name === name && x.point === p); return o ? o.price : null; };
      const odds = (name, p) => Object.fromEntries(Object.entries(mk.spreads).map(([k,o]) => [k, pick(name, p, o)]));
      markets.push({ type:C.spread, sides:[
        { name:nick(away) + " " + fmtPt(pt), odds:odds(away, pt), sharp:pick(away, pt, sharp.spreads) },
        { name:nick(home) + " " + fmtPt(-pt), odds:odds(home, -pt), sharp:pick(home, -pt, sharp.spreads) } ]});
    }
  }
  if (mk.totals){
    const pt = +mostCommon(Object.values(mk.totals).map(o => (o[0]||{}).point));
    const pick = (name, src) => { const o = (src||[]).find(x => x.name === name && x.point === pt); return o ? o.price : null; };
    markets.push({ type:"Total", sides:["Over","Under"].map(n => ({ name:n + " " + pt, odds:Object.fromEntries(Object.entries(mk.totals).map(([k,o]) => [k, pick(n, o)])), sharp:pick(n, sharp.totals) })) });
  }
  const t = start.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit", timeZone:"America/New_York" });
  const today = start.toLocaleDateString("en-US", { timeZone:"America/New_York" }) === new Date().toLocaleDateString("en-US", { timeZone:"America/New_York" });
  return { id:ev.id, away:nick(away), home:nick(home), awayFull:away, homeFull:home, sport:sp, awayAbbr:C.abbr[away]||nick(away).slice(0,3).toUpperCase(), homeAbbr:C.abbr[home]||nick(home).slice(0,3).toUpperCase(),
    start, started:start <= new Date(), time:(today ? "" : start.toLocaleDateString("en-US",{weekday:"short", timeZone:"America/New_York"}) + " ") + t, trends:[], markets:markets.filter(m => m.sides.every(s => Object.values(s.odds).some(v => v != null))), live:true };
}

function recordHistory(games){
  const h = store.get("sl_hist") || {};
  const now = Date.now();
  games.forEach(g => {
    const ml = g.markets.find(m => m.type === "Moneyline"); if (!ml) return;
    const fp = fairProbs(ml)[1];
    const arr = h[g.id] = h[g.id] || [];
    if (!arr.length || now - arr[arr.length-1].t > 60000) arr.push({ t:now, v:toAm(1/fp) });
    if (arr.length > 30) arr.splice(0, arr.length-30);
  });
  const ids = Object.keys(h); if (ids.length > 80) ids.slice(0, ids.length - 80).forEach(id => delete h[id]);
  store.set("sl_hist", h);
  games.forEach(g => g.move = (h[g.id]||[]).map(x => x.v));
}

async function loadLines(){
  const hosted = window.SLB && SLB.ODDS && SLB.ODDS[sport];

    const cutoff = Date.now() + C.days*864e5;
    const games = evs.map(e => toGame(e, sp)).filter(g => g.markets.length && g.start.getTime() < cutoff).sort((a,b) => a.start - b.start);

function toProps(ev, gid, sp){
  const rows = {};
  ev.bookmakers.forEach(b => {
    const k = BOOK_KEYS[b.key]; if (!k) return;
    b.markets.forEach(m => {
      const s = CFG[sp].markets[m.key]; if (!s) return;
      m.outcomes.forEach(o => {
        if (/ D\/ST$| Defense$/.test(o.description)) return;
        const pt = o.point != null ? o.point : 0.5;
        const key = s + "|" + o.description + "|" + pt;
        const r = rows[key] = rows[key] || { p:o.description, s, line:pt, g:gid, books:{}, yesOnly:o.name === "Yes" };
        (r.books[k] = r.books[k] || {})[o.name === "Over" || o.name === "Yes" ? "o" : "u"] = o.price;
      });
    });
  });
  return Object.values(rows).map(r => {
    const both = Object.values(r.books).filter(b => b.o != null && b.u != null);
    let fair = both.length ? both.reduce((a,b) => { const po = imp(b.o), pu = imp(b.u); return a + po/(po+pu); }, 0) / both.length : null;
    const overs = Object.values(r.books).filter(b => b.o != null);
    if (fair == null && r.yesOnly && overs.length >= 2) fair = overs.reduce((a,b) => a + imp(b.o), 0) / overs.length / 1.07;
    const best = side => { let bk = null, v = null; Object.entries(r.books).forEach(([k,b]) => { if (b[side] != null && (v == null || dec(b[side]) > dec(v))){ v = b[side]; bk = k; } }); return v == null ? null : { book:bk, odds:v }; };
    r.bestO = best("o"); r.bestU = best("u"); r.fair = fair; r.nBooks = Object.keys(r.books).length;
    r.lean = null;
    if (fair != null && (both.length >= 2 || (r.yesOnly && overs.length >= 2))){
      const eo = r.bestO ? fair*dec(r.bestO.odds) - 1 : -1, eu = r.bestU ? (1-fair)*dec(r.bestU.odds) - 1 : -1;
      if (eo > 0.015 && eo >= eu) r.lean = { side:"Over", ev:eo, odds:r.bestO.odds, book:r.bestO.book, prob:fair };
      else if (eu > 0.015) r.lean = { side:"Under", ev:eu, odds:r.bestU.odds, book:r.bestU.book, prob:1-fair };
    }
    return r;
  });
}

/* ---------- Player history from the NHL's public stats API (through Zapier) ---------- */
const NHL_DIV = {BOS:"A",BUF:"A",DET:"A",FLA:"A",MTL:"A",OTT:"A",TBL:"A",TOR:"A",CAR:"M",CBJ:"M",NJD:"M",NYI:"M",NYR:"M",PHI:"M",PIT:"M",WSH:"M",CHI:"C",COL:"C",DAL:"C",MIN:"C",NSH:"C",STL:"C",UTA:"C",WPG:"C",ANA:"P",CGY:"P",EDM:"P",LAK:"P",SJS:"P",SEA:"P",VAN:"P",VGK:"P"};
const DIV_NAME = {A:"Atlantic",M:"Metropolitan",C:"Central",P:"Pacific"};
const ROSTERS = {}, HIST = {};
const norm = n => String(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
const etDate = d => d.toLocaleDateString("en-CA", { timeZone:"America/New_York" });
const dayNum = s => Math.round(Date.parse(s + "T00:00:00Z") / 864e5);
function seasonIds(){ const d = new Date(), y = d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1; return { cur:`${y}${y+1}`, prev:`${y-1}${y}` }; }

async function nhlGet(path){
  if (!mcpNs) throw { code:"no_mcp" };
  const res = await mcpNs.callTool("Zapier", "execute_zapier_write_action", {
    action:"get", selected_api:"WebHookCLIAPI", params:{ url:"https://api-web.nhle.com/v1/" + path }
  }, { cache:false });
  let p = res.payload;
  if (typeof p === "string"){ try { p = JSON.parse(p); } catch(e){} }
  if (p && Array.isArray(p.results)) return p.results[0] || {};
  return p || {};
}

async function loadRoster(abbr){
  if (ROSTERS[abbr]) return;
  const r = await nhlGet("roster/" + abbr + "/current");
  const m = {};
  ["forwards","defensemen","goalies"].forEach(grp => (r[grp] || []).forEach(p => {
    m[norm(p.firstName.default + " " + p.lastName.default)] = { id:p.id, key:"nhl:" + p.id, sport:"nhl", pos:p.positionCode === "D" ? "D" : p.positionCode === "G" ? "G" : "F", team:abbr };
  }));
  ROSTERS[abbr] = m;
}
function findPlayer(name, g){
  const n = norm(name).replace(/ (jr|sr|ii|iii|iv)$/,""), pre = g.sport === "nfl" ? "nfl:" : "";
  const teams = [pre + g.awayAbbr, pre + g.homeAbbr];
  for (const t of teams){ const m = ROSTERS[t] || {}; for (const k in m){ if (k.replace(/ (jr|sr|ii|iii|iv)$/,"") === n) return m[k]; } }
  for (const t of teams){ const m = ROSTERS[t]; if (m && m[n]) return m[n]; }
  const parts = n.split(" "), fi = parts[0][0], last = parts.slice(1).join(" ");
  for (const t of teams){ const m = ROSTERS[t] || {}; for (const k in m){ const kp = k.split(" "); if (kp.slice(1).join(" ") === last && kp[0][0] === fi) return m[k]; } }
  return null;
}

function compactLog(x, se){ return { d:x.gameDate, h:x.homeRoadFlag === "H", o:x.opponentAbbrev, g:x.goals||0, a:x.assists||0, s:x.shots, gs:x.gamesStarted, sv:x.shotsAgainst != null ? x.shotsAgainst - (x.goalsAgainst||0) : null, se }; }

async function loadHistory(pl){
  const id = pl.key;
  const h = HIST[id];
  if (h && (h.status === "ok" || h.status === "loading")) return;
  const today = etDate(new Date()), cached = store.get("sl_log_" + id);
  if (cached && cached.day === today){ HIST[id] = { status:"ok", games:cached.games }; return; }
  HIST[id] = { status:"loading" };
  if (pl.sport === "nfl"){
    try {
      const games = (await loadNflHistory(pl)).sort((p,q) => q.d < p.d ? -1 : 1);
      HIST[id] = { status:"ok", games }; store.set("sl_log_" + id, { day:today, games });
    } catch(err){ HIST[id] = { status:"err", error:errText(err) }; }
    return;
  }
  const { cur, prev } = seasonIds();
  try {
    const [a, b] = await Promise.all([
      nhlGet(`player/${pl.id}/game-log/${cur}/2`).catch(() => ({ gameLog:[] })),
      nhlGet(`player/${pl.id}/game-log/${prev}/2`).catch(() => ({ gameLog:[] }))
    ]);
    const games = [...(a.gameLog||[]).map(x => compactLog(x,"cur")), ...(b.gameLog||[]).map(x => compactLog(x,"prev"))].sort((p,q) => q.d < p.d ? -1 : 1);
    if (!games.length && !(a.gameLog||b.gameLog)) throw { code:"tool_error", message:"No game log returned." };
    HIST[id] = { status:"ok", games };
    store.set("sl_log_" + id, { day:today, games });
  } catch(err){ HIST[id] = { status:"err", error:errText(err) }; }
}

function statVal(x, s){
  if (s === "Anytime TD") return x.td;
  if (NFL_FIELDS[s]) return x[NFL_FIELDS[s]];
  if (s === "Shots on goal") return x.s;
  if (s === "Points") return x.g + x.a;
  if (s === "Assists") return x.a;
  if (s === "Goals") return x.g;
  if (s === "Saves") return x.gs === 1 ? x.sv : null;
  return null;
}


function splits(r){
  if (!r.pl) return null;
  const H = HIST[r.pl.key]; if (!H || H.status !== "ok") return null;
  const g = gameById(r.g), C = CFG[g.sport || "nhl"], DV = C.div, M = C.min;
  const all = H.games.filter(x => statVal(x, r.s) != null);
  if (!all.length) return { empty:true };
  const asc = all.slice().reverse();
  asc.forEach((x,i) => { const p = asc[i-1]; x.gap = p && p.se === x.se ? C.restGap(x.d, p.d) : null; });
  const hit = x => statVal(x, r.s) > r.line;
  const rate = arr => [arr.filter(hit).length, arr.length];
  const home = r.pl.team === g.homeAbbr, opp = home ? g.awayAbbr : g.homeAbbr;
  const tonightGap = C.restGap(etDate(g.start), all[0].d);
  const rl = C.rest(tonightGap);
  const last10 = all.slice(0,10);
  const vsArr = all.filter(x => x.o === opp);
  const out = {
    opp, home, divTonight:DV[opp] && DV[opp] === DV[r.pl.team], divName:C.divName[DV[r.pl.team]] || "Division",
    l10:last10.map(x => statVal(x, r.s)).reverse(), hit10:last10.filter(hit).length, n10:last10.length,
    cur:rate(all.filter(x => x.se === "cur")), prev:rate(all.filter(x => x.se === "prev")),
    vs:[...rate(vsArr), vsArr.length ? +(vsArr.reduce((a,x) => a + statVal(x, r.s), 0) / vsArr.length).toFixed(1) : 0],
    div:rate(all.filter(x => DV[x.o] && DV[x.o] === DV[r.pl.team])),
    loc:rate(all.filter(x => x.h === home)),
    rest:[...rate(all.filter(x => x.gap != null && C.rest(x.gap) === rl)), rl],
    avg10:last10.length ? +(last10.reduce((a,x) => a + statVal(x, r.s), 0) / last10.length).toFixed(1) : 0
  };
  const parts = [
    out.n10 >= M.l10 ? [out.hit10/out.n10, .30] : null,
    out.cur[1] >= M.cur ? [out.cur[0]/out.cur[1], .15] : null,
    out.prev[1] >= M.prev ? [out.prev[0]/out.prev[1], .15] : null,
    out.vs[1] >= M.vs ? [out.vs[0]/out.vs[1], .15] : null,
    out.loc[1] >= M.loc ? [out.loc[0]/out.loc[1], .10] : null,
    out.rest[1] >= M.rest ? [out.rest[0]/out.rest[1], .10] : null,
    out.div[1] >= M.div ? [out.div[0]/out.div[1], .05] : null
  ].filter(Boolean);
  if (parts.length){
    const w = parts.reduce((a,x) => a + x[1], 0);
    out.histP = parts.reduce((a,x) => a + x[0]*x[1], 0) / w;
    const k = 0.5 * all.length / (all.length + 8);
    out.model = r.fair != null ? r.fair + k*(out.histP - r.fair) : out.histP;
    const eo = r.bestO ? out.model*dec(r.bestO.odds) - 1 : -1, eu = r.bestU ? (1-out.model)*dec(r.bestU.odds) - 1 : -1;
    if (eo > 0.03 && eo >= eu) out.lean = { side:"Over", ev:eo, odds:r.bestO.odds, book:r.bestO.book, prob:out.model, model:true };
    else if (eu > 0.03) out.lean = { side:"Under", ev:eu, odds:r.bestU.odds, book:r.bestU.book, prob:1-out.model, model:true };
    else out.lean = null;
  }
  return out;
}
function rowLean(r){ const sp = splits(r); return sp && sp.model != null ? sp.lean : r.lean; }

async function loadHistories(ids){
  const queue = ids.slice(); let active = 0;
  await new Promise(done => {
    const next = () => {
      if (!queue.length && !active) return done();
      while (active < 3 && queue.length){
        const pl = queue.shift(); active++;
        loadHistory(pl).finally(() => { active--; render(); next(); });
      }
    };
    next();
  });
}

function liveDetail(r, sp){
  const H = r.pl ? HIST[r.pl.key] : null;
  let hist;
  if (!r.pl) hist = `<p class="note">Couldn’t match ${r.p} to a ${cfg().label} roster, so there’s no game log for this player.</p>`;

  else if (H.status === "err") hist = `<p class="note">${H.error}</p>`;
  else if (!sp || sp.empty) hist = `<p class="note">No ${r.s.toLowerCase()} games on record for ${r.p} in the last two seasons.</p>`;
  else {
    const max = Math.max(...sp.l10, r.line, 1) * 1.15;
    hist = `
    <div class="bars" aria-label="Last ${sp.n10} games">
      ${sp.l10.map(v => `<div class="bar ${v>r.line?"hit":""}" style="height:${Math.max(4,(v/max*100)).toFixed(0)}%"><span>${v}</span></div>`).join("")}
      <div class="lineMark" style="bottom:${(r.line/max*100).toFixed(0)}%"></div>
    </div>
    <div class="hist">
      ${histCell("Last " + sp.n10, sp.n10 ? [sp.hit10, sp.n10] : null, ", avg " + sp.avg10)}
      ${histCell("This season", sp.cur[1] ? sp.cur : null)}
      ${histCell("Last season", sp.prev[1] ? sp.prev : null)}
      ${histCell("vs " + sp.opp, sp.vs[1] ? [sp.vs[0], sp.vs[1]] : null, sp.vs[1] ? ", avg " + sp.vs[2] : "")}
      ${histCell(sp.divName + " games", sp.div[1] ? sp.div : null)}
      ${histCell(sp.home ? "At home" : "On the road", sp.loc[1] ? sp.loc : null)}
      ${histCell(sp.rest[2], sp.rest[1] ? [sp.rest[0], sp.rest[1]] : null)}
    </div>
    <div class="model">
      ${sp.model != null ? `<span>Model <b>${(sp.model*100).toFixed(0)}%</b></span>` : ""}
      <span>History <b>${sp.histP != null ? (sp.histP*100).toFixed(0) + "%" : "—"}</b></span>

      ${sp.divTonight ? `<span class="tag neutral">Division game tonight</span>` : ""}
    </div>`;
  }
  return hist + `
    <div class="board-wrap" style="margin-top:12px"><table class="board" style="min-width:0"><thead><tr><th></th>${BOOKS.map(b=>`<th>${b}</th>`).join("")}<th>Fair</th></tr></thead><tbody>
    ${["o","u"].map(sd => `<tr><td>${sd==="o"?"Over":"Under"} ${r.line}</td>${BOOKS.map(b => { const v = r.books[b]?.[sd]; const best = (sd==="o"?r.bestO:r.bestU); return `<td>${v==null ? `<span class="fair">—</span>` : `<button class="cell ${best&&best.book===b?"best":""}" data-pb="${b}" data-ps="${sd}">${fmt(v)}</button>`}</td>`; }).join("")}<td class="fair">${r.fair!=null ? fmt(toAm(1/(sd==="o"?r.fair:1-r.fair))) : "—"}</td></tr>`).join("")}
    </tbody></table></div>`;
}

async function webGet(url, data){
  if (!mcpNs) throw { code:"no_mcp" };
  const params = { url }; if (data) params.data = data;
  const res = await mcpNs.callTool("Zapier", "execute_zapier_write_action", { action:"get", selected_api:"WebHookCLIAPI", params }, { cache:false });
  let p = res.payload;
  if (typeof p === "string"){ try { p = JSON.parse(p); } catch(e){} }
  if (p && Array.isArray(p.results)) return p.results[0] || {};
  return p || {};
}

async function loadNflRoster(abbr){
  if (ROSTERS["nfl:" + abbr]) return;
  const r = await webGet("https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/" + abbr.toLowerCase() + "/roster");
  const m = {};
  (r.athletes || []).forEach(grp => (grp.items || []).forEach(p => {
    m[norm(p.fullName || p.displayName)] = { id:p.id, key:"nfl:" + p.id, pos:(p.position && p.position.abbreviation) || "", team:abbr, sport:"nfl" };
  }));
  ROSTERS["nfl:" + abbr] = m;
}

function parseEspnLog(p, se){
  const names = p.names || [], evs = p.events || {}, seen = new Set(), out = [];
  (p.seasonTypes || []).filter(st => /Regular Season/i.test(st.displayName || "")).forEach(st => (st.categories || []).forEach(c => (c.events || []).forEach(e => {
    const ev = evs[e.eventId]; if (!ev || seen.has(e.eventId)) return; seen.add(e.eventId);
    const v = {}; names.forEach((n,i) => { const x = parseFloat(e.stats[i]); if (!isNaN(x)) v[n] = x; });
    out.push({ d:String(ev.gameDate).slice(0,10), h:ev.atVs !== "@", o:ev.opponent && ev.opponent.abbreviation, se,
      py:v.passingYards||0, ptd:v.passingTouchdowns||0, ry:v.rushingYards||0, recy:v.receivingYards||0, rec:v.receptions||0, td:(v.rushingTouchdowns||0) + (v.receivingTouchdowns||0) });
  })));
  return out;
}

async function loadNflHistory(pl){
  const y = new Date().getMonth() >= 2 ? new Date().getFullYear() : new Date().getFullYear() - 1;
  const base = "https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/" + pl.id + "/gamelog";
  const [a, b] = await Promise.all([ webGet(base).catch(() => ({})), webGet(base, { season:String(y-1) }).catch(() => ({})) ]);
  return [...parseEspnLog(a, "cur"), ...parseEspnLog(b, "prev")];
}


/* ---------- Team history: head-to-head, division, home/road, time slot, rest (NHL API + ESPN through Zapier) ---------- */
const TEAMH = {};
const openTrends = new Set();

function parseNhlSched(p, abbr, se){
  return (p.games || []).filter(x => x.gameType === 2 && (x.gameState === "OFF" || x.gameState === "FINAL")).map(x => {
    const h = x.homeTeam.abbrev === abbr, me = h ? x.homeTeam : x.awayTeam, op = h ? x.awayTeam : x.homeTeam;
    return { d:x.startTimeUTC, h, o:op.abbrev, pf:me.score, pa:op.score, se };
  });
}
function parseEspnSched(p, abbr, se){
  return (p.events || []).filter(e => e.seasonType && e.seasonType.type === 2).map(e => {
    const c = e.competitions && e.competitions[0]; if (!c || !c.status || !c.status.type || !c.status.type.completed) return null;
    const me = c.competitors.find(t => t.team && t.team.abbreviation === abbr), op = c.competitors.find(t => t !== me);
    if (!me || !op) return null;
    return { d:e.date, h:me.homeAway === "home", o:op.team.abbreviation, pf:+(me.score && me.score.value), pa:+(op.score && op.score.value), se };
  }).filter(Boolean);
}

async function loadTeamHist(sp, abbr){
  const key = sp + ":" + abbr, today = etDate(new Date());
  const t = TEAMH[key]; if (t && (t.status === "ok" || t.status === "loading")) return;
  const cached = store.get("sl_team_" + key);
  if (cached && cached.day === today){ TEAMH[key] = { status:"ok", games:cached.games }; return; }
  TEAMH[key] = { status:"loading" };
  try {
    let games = [];
    if (sp === "nhl"){
      const { cur, prev } = seasonIds();
      const [a, b] = await Promise.all([cur, prev].map(s => webGet("https://api-web.nhle.com/v1/club-schedule-season/" + abbr + "/" + s).catch(() => ({}))));
      games = [...parseNhlSched(a, abbr, "cur"), ...parseNhlSched(b, abbr, "p1")];
    } else {
      const y = new Date().getMonth() >= 2 ? new Date().getFullYear() : new Date().getFullYear() - 1;
      const url = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/" + abbr.toLowerCase() + "/schedule";
      const res = await Promise.all([y, y-1, y-2].map(s => webGet(url, { season:String(s) }).catch(() => ({}))));
      games = res.flatMap((p,i) => parseEspnSched(p, abbr, ["cur","p1","p2"][i]));
    }
    if (!games.length) throw { code:"tool_error", message:"No completed games returned." };
    games.sort((p,q) => q.d < p.d ? -1 : 1);
    TEAMH[key] = { status:"ok", games };
    store.set("sl_team_" + key, { day:today, games });
  } catch(err){ TEAMH[key] = { status:"err", error:errText(err) }; }
}
async function loadTrends(g){
  await Promise.all([loadTeamHist(g.sport, g.awayAbbr), loadTeamHist(g.sport, g.homeAbbr)]);
  render();
}

const etHour = d => { const p = new Date(d).toLocaleString("en-US", { timeZone:"America/New_York", hour:"numeric", minute:"numeric", hour12:false }).split(":"); return (+p[0] % 24) + (+p[1])/60; };
function slotOf(sp, d){
  const h = etHour(d);
  if (sp === "nfl") return h < 15 ? "Early kickoffs" : h < 19 ? "Late afternoon kickoffs" : "Primetime";
  return h < 17 ? "Afternoon games" : h < 21 ? "Evening games" : "Late games";
}
function gameLines(g){
  const C = CFG[g.sport];
  const sm = g.markets.find(m => m.type === C.spread), tm = g.markets.find(m => m.type === "Total");
  const num = s => { const v = parseFloat(String(s).split(" ").pop()); return isNaN(v) ? null : v; };
  return { away:sm ? num(sm.sides[0].name) : null, home:sm ? num(sm.sides[1].name) : null, total:tm ? num(tm.sides[0].name) : null };
}

function agg(arr, spr, tot){
  const r = { n:arr.length, w:0, l:0, t:0, cov:[0,0], ov:[0,0], pf:0, pa:0 };
  arr.forEach(x => {
    if (x.pf > x.pa) r.w++; else if (x.pf < x.pa) r.l++; else r.t++;
    r.pf += x.pf; r.pa += x.pa;
    if (spr != null){ const m = x.pf - x.pa + spr; if (m !== 0){ r.cov[1]++; if (m > 0) r.cov[0]++; } }
    if (tot != null){ const s = x.pf + x.pa; if (s !== tot){ r.ov[1]++; if (s > tot) r.ov[0]++; } }
  });
  if (r.n){ r.pf /= r.n; r.pa /= r.n; }
  return r;
}

function teamSplits(g, abbr, isHome){
  const T = TEAMH[g.sport + ":" + abbr]; if (!T || T.status !== "ok") return null;
  const C = CFG[g.sport], DV = C.div, L = gameLines(g);
  const spr = isHome ? L.home : L.away, tot = L.total, opp = isHome ? g.awayAbbr : g.homeAbbr;
  const all = T.games, asc = all.slice().reverse();
  asc.forEach((x,i) => { const p = asc[i-1]; x.gap = p && p.se === x.se ? C.restGap(etDate(new Date(x.d)), etDate(new Date(p.d))) : null; });
  const slot = slotOf(g.sport, g.start);
  const restNow = all.length ? C.rest(C.restGap(etDate(g.start), etDate(new Date(all[0].d)))) : null;
  const rows = [
    ["Last 10", all.slice(0,10)],
    ["This season", all.filter(x => x.se === "cur")],
    [isHome ? "At home" : "On the road", all.filter(x => x.h === isHome)],
    ["vs " + (C.divName[DV[abbr]] || "division"), all.filter(x => DV[x.o] && DV[x.o] === DV[abbr])],
    [slot, all.filter(x => slotOf(g.sport, x.d) === slot)],
    [restNow || "Rest", restNow ? all.filter(x => x.gap != null && C.rest(x.gap) === restNow) : []],
    ["vs " + opp, all.filter(x => x.o === opp)]
  ].map(([label, arr]) => ({ label, a:agg(arr, spr, tot) }));
  return { abbr, isHome, spr, tot, rows, h2h:all.filter(x => x.o === opp) };
}

function trendHighlights(g){
  if (RES[g.sport]) return resHighlights(g);
  const out = [];
  [[g.awayAbbr,false,g.away],[g.homeAbbr,true,g.home]].forEach(([ab, isHome, name]) => {
    const S = teamSplits(g, ab, isHome); if (!S) return;
    const minN = g.sport === "nfl" ? 4 : 6;
    S.rows.forEach(r => {
      const a = r.a, lbl = r.label.charAt(0).toLowerCase() + r.label.slice(1);
      if (a.cov[1] >= minN){ const p = a.cov[0]/a.cov[1]; if (p >= .7 || p <= .3) out.push({ s:Math.abs(p-.5)*Math.sqrt(a.cov[1]), t:`${name} covered tonight’s ${fmtPt(S.spr)} in ${a.cov[0]} of ${a.cov[1]}, ${lbl}` }); }
      if (a.ov[1] >= minN){ const p = a.ov[0]/a.ov[1]; if (p >= .7 || p <= .3) out.push({ s:Math.abs(p-.5)*Math.sqrt(a.ov[1]), t:`${name} games went over ${S.tot} in ${a.ov[0]} of ${a.ov[1]}, ${lbl}` }); }
      if (a.n >= minN){ const p = a.w/a.n; if (p >= .75 || p <= .25) out.push({ s:Math.abs(p-.5)*Math.sqrt(a.n)*0.8, t:`${name} are ${a.w}–${a.l}${a.t?"–"+a.t:""} straight up, ${lbl}` }); }
    });
  });
  return out.sort((a,b) => b.s - a.s).slice(0,5);
}

function trendBlock(g){
  const ka = g.sport + ":" + g.awayAbbr, kh = g.sport + ":" + g.homeAbbr, A = TEAMH[ka], Hm = TEAMH[kh];
  const open = openTrends.has(g.id);
  const loading = (A && A.status === "loading") || (Hm && Hm.status === "loading");
  const loaded = A && A.status === "ok" && Hm && Hm.status === "ok";
  const err = [A, Hm].find(x => x && x.status === "err");
  const calls = g.sport === "nfl" ? 6 : 4;
  if (!loaded) return `<div class="ttbar">${loading ? `<span class="note">Loading team history…</span>` : err ? `<span class="note">${err.error}</span><button class="chip" data-tt="${g.id}">Try again</button>` : `<button class="chip" data-tt="${g.id}">Load team history</button><span class="note">${calls} Zapier tasks</span>`}</div>`;
  const hl = trendHighlights(g);
  const SA = teamSplits(g, g.awayAbbr, false), SH = teamSplits(g, g.homeAbbr, true);
  const cell = (c) => c[1] ? `<b class="${c[0]/c[1]>=.6?"good":c[0]/c[1]<=.4?"bad":""}">${c[0]}–${c[1]-c[0]}</b>` : `<span class="mut">—</span>`;
  const table = (S, name) => `<div class="ttteam"><div class="ttname">${name} <span class="mut">${S.isHome ? "home" : "road"}${S.spr != null ? ", " + fmtPt(S.spr) : ""}</span></div>
    <div class="board-wrap"><table class="tt"><thead><tr><th></th><th>W–L</th><th>Cover ${S.spr != null ? fmtPt(S.spr) : ""}</th><th>Over ${S.tot ?? ""}</th><th>Avg score</th></tr></thead><tbody>
    ${S.rows.map(r => `<tr><td>${r.label}<small>${r.a.n} game${r.a.n===1?"":"s"}</small></td><td>${r.a.n ? `${r.a.w}–${r.a.l}${r.a.t?"–"+r.a.t:""}` : "—"}</td><td>${cell(r.a.cov)}</td><td>${cell(r.a.ov)}</td><td>${r.a.n ? r.a.pf.toFixed(1) + "–" + r.a.pa.toFixed(1) : "—"}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  const h2h = SH.h2h.slice(0,8);
  return `<div class="ttbar"><button class="chip ${open?"on":""}" data-ttopen="${g.id}">${open ? "Hide team history" : "Team history"}</button></div>
    ${hl.length ? `<ul class="trends">${hl.map(x => `<li>${x.t}</li>`).join("")}</ul>` : ""}
    ${open ? `<div class="ttwrap">
      ${table(SA, g.away)}${table(SH, g.home)}
      <div class="ttname">Last meetings</div>
      ${h2h.length ? `<div class="h2h">${h2h.map(x => `<div><span>${new Date(x.d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</span><span>${x.h ? g.awayAbbr + " " + x.pa + " @ " + g.homeAbbr + " " + x.pf : g.homeAbbr + " " + x.pf + " @ " + g.awayAbbr + " " + x.pa}</span><span>Total ${x.pf + x.pa}</span></div>`).join("")}</div>` : `<p class="note">No meetings in the seasons loaded.</p>`}
      <p class="note">Cover and over columns test each past game against tonight’s line, not the line at the time. Pushes are left out.</p>
    </div>` : ""}`;
}

function etToDate(d, t){
  for (const off of ["-04:00","-05:00"]){
    const x = new Date(d + "T" + (t || "13:00") + ":00" + off);
    if (etDate(x) === d && Math.abs(etHour(x) - hhmm(t || "13:00")) < 0.01) return x;
  }
  return new Date(d + "T" + (t || "13:00") + ":00-05:00");
}

const _teamLogCache = {};
function nflvTeam(ab){
  if (_teamLogCache[ab]) return _teamLogCache[ab];
  const asc = NFLV.filter(x => x.played && (x.a === ab || x.h === ab)).map(x => {
    const home = x.h === ab;
    return { season:x.season, week:x.week, date:x.date, time:x.time, home, neutral:x.neutral, opp:home ? x.a : x.h,
      pf:home ? x.hs : x.as, pa:home ? x.as : x.hs, line:x.sl == null ? null : (home ? -x.sl : x.sl), tot:x.tot,
      rest:home ? x.hrest : x.arest, div:x.div, indoor:x.indoor, slot:nflvSlot(x.time) };
  });
  asc.forEach((x,i) => { const p = asc[i-1]; x.prev = p && p.season === x.season ? (p.pf > p.pa ? "W" : p.pf < p.pa ? "L" : "T") : null; });
  return _teamLogCache[ab] = asc.reverse();
}
function nflvRow(away, home){
  const up = NFLV.filter(x => x.a === away && x.h === home && !x.played);

}

function aggV(arr){
  const r = { n:arr.length, w:0, l:0, t:0, ats:[0,0,0], ou:[0,0,0], marg:0, atsm:0, na:0 };
  arr.forEach(x => {
    const m = x.pf - x.pa; r.marg += m;
    if (m > 0) r.w++; else if (m < 0) r.l++; else r.t++;
    if (x.line != null){ const c = m + x.line; r.atsm += c; r.na++; r.ats[c > 0 ? 0 : c < 0 ? 1 : 2]++; }
    if (x.tot != null){ const s = x.pf + x.pa; r.ou[s > x.tot ? 0 : s < x.tot ? 1 : 2]++; }
  });
  if (r.n) r.marg /= r.n; if (r.na) r.atsm /= r.na;
  return r;
}

function nflvCtx(g){
  const row = nflvRow(g.awayAbbr, g.homeAbbr);
  const L = g.markets && g.markets.length ? gameLines(g) : {};
  const homeLine = row && row.sl != null ? -row.sl : L.home, tot = row && row.tot != null ? row.tot : L.total;
  const time = row ? row.time : g.start.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"America/New_York"});
  return { row, homeLine, tot, slot:nflvSlot(time), div:row ? row.div : NFL_DIV[g.awayAbbr] === NFL_DIV[g.homeAbbr] ? 1 : 0, indoor:row ? row.indoor : null,
    arest:row ? row.arest : null, hrest:row ? row.hrest : null };
}

function nflvSplits(g, ab, isHome){
  const C = nflvCtx(g), all = nflvTeam(ab);
  if (!all.length) return null;
  const recent = all.filter(x => x.season >= NFLV_SEASON - 2);
  const opp = isHome ? g.awayAbbr : g.homeAbbr;
  const line = C.homeLine == null ? null : isHome ? C.homeLine : -C.homeLine;
  const rest = nflvRest(isHome ? C.hrest : C.arest);
  const last = all[0], prevNow = last && last.season === NFLV_SEASON ? (last.pf > last.pa ? "W" : last.pf < last.pa ? "L" : "T") : null;
  const role = line == null || line === 0 ? null : line < 0 ? "fav" : "dog";
  const rows = [
    ["Last 10", all.slice(0,10)],
    ["This season", all.filter(x => x.season === NFLV_SEASON)],
    [isHome ? "At home" : "On the road", recent.filter(x => x.home === isHome && !x.neutral)],
    role ? [role === "fav" ? "As a favorite" : "As an underdog", recent.filter(x => x.line != null && (role === "fav" ? x.line < 0 : x.line > 0))] : null,
    role && !isHome && role === "dog" ? ["As a road underdog", recent.filter(x => !x.home && x.line > 0)] : null,
    role && isHome && role === "fav" ? ["As a home favorite", recent.filter(x => x.home && x.line < 0)] : null,
    C.div ? [R.divLabel || "Division games", recent.filter(x => x.div)] : null,
    [C.slot, recent.filter(x => x.slot === C.slot)],
    rest ? [rest, recent.filter(x => nflvRest(x.rest) === rest)] : null,
    C.indoor != null ? [C.indoor ? "Indoors" : "Outdoors", recent.filter(x => x.indoor === C.indoor)] : null,
    prevNow ? [prevNow === "W" ? "After a win" : prevNow === "L" ? "After a loss" : "After a tie", recent.filter(x => x.prev === prevNow)] : null,
    ["vs " + opp + " since 2021", all.filter(x => x.opp === opp)]
  ].filter(Boolean).map(([label, arr]) => ({ label, a:aggV(arr) }));
  return { ab, isHome, line, tot:C.tot, rows, h2h:all.filter(x => x.opp === opp) };
}

function nflvHighlights(g){
  const out = [];
  [[g.awayAbbr,false],[g.homeAbbr,true]].forEach(([ab, isHome]) => {
    const S = nflvSplits(g, ab, isHome); if (!S) return;
    const name = nflNick(ab);
    S.rows.forEach(r => {
      const a = r.a, lbl = r.label.charAt(0).toLowerCase() + r.label.slice(1);
      const an = a.ats[0] + a.ats[1], on = a.ou[0] + a.ou[1];
      if (an >= 6){ const p = a.ats[0]/an; if (p >= .7 || p <= .3) out.push({ s:Math.abs(p-.5)*Math.sqrt(an), t:`${name} are ${a.ats[0]}–${a.ats[1]}${a.ats[2]?"–"+a.ats[2]:""} against the spread, ${lbl}` }); }
      if (on >= 6){ const p = a.ou[0]/on; if (p >= .7 || p <= .3) out.push({ s:Math.abs(p-.5)*Math.sqrt(on), t:`${name} games went ${p >= .5 ? "over" : "under"} the closing total in ${p >= .5 ? a.ou[0] : a.ou[1]} of ${on}, ${lbl}` }); }
      if (a.n >= 6){ const p = a.w/a.n; if (p >= .8 || p <= .2) out.push({ s:Math.abs(p-.5)*Math.sqrt(a.n)*0.7, t:`${name} are ${a.w}–${a.l}${a.t?"–"+a.t:""} straight up, ${lbl}` }); }
    });
  });
  return out.sort((a,b) => b.s - a.s).slice(0,5);
}

function nflvConsensus(g){

function resHighlights(g){

      if (on >= min && (S.real || S.tested)){ const p = a.ou[0]/on; if (p >= .7 || p <= .3) out.push({ s:Math.abs(p-.5)*Math.sqrt(on), real:S.real, mkt:"total", side:p >= .5 ? "over" : "under", t:`${name} games went ${p >= .5 ? "over" : "under"} ${S.real ? "the closing total" : S.tot} in ${p >= .5 ? a.ou[0] : a.ou[1]} of ${on}, ${lbl}` }); }

function legFromSlip(l){
  const g = gameById(l.gid); if (!g) return { kind:"other", text:l.side, odds:l.odds };
  const num = s => { const v = parseFloat(String(s).split(" ").pop()); return isNaN(v) ? null : v; };
  const isAway = s => s.startsWith(g.away), isHome = s => s.startsWith(g.home);
  let kind = "other", side = null, line = null;
  if (l.type === "Moneyline"){ kind = "ml"; side = isAway(l.side) ? "away" : isHome(l.side) ? "home" : null; }
  else if (l.type === "Spread" || l.type === "Puck line"){ kind = "spread"; side = isAway(l.side) ? "away" : isHome(l.side) ? "home" : null; line = num(l.side); }
  else if (l.type === "Total"){ kind = "total"; side = l.side.startsWith("Over") ? "over" : "under"; line = num(l.side); }
  if (kind !== "other" && !side) kind = "other";
  return { kind, side, line, odds:l.odds, text:l.side + (kind === "other" ? " (" + l.type + ")" : ""), gid:l.gid, sport:g.sport, a:g.awayAbbr, h:g.homeAbbr, date:etDate(g.start), game:matchup(g) };
}

function logBet(legs, stakeAmt, book){

  const decAll = legs.reduce((a,l) => a*dec(l.odds), 1);
  BETS.unshift({ id:Date.now().toString(36), ts:new Date().toISOString(), legs, stake:+stakeAmt || 0, odds:toAm(decAll), book, status:"open" });

function findPlayed(L){
  const R = RES[L.sport]; if (!R || !L.a) return null;
  return R.rows.find(x => x.played && x.a === L.a && x.h === L.h && Math.abs(dayNum(x.date) - dayNum(L.date)) <= 1) || null;
}
function legOutcome(L){
  if (L.manual) return L.manual;
  if (L.kind === "other") return null;
  const r = findPlayed(L); if (!r) return null;
  if (L.kind === "ml"){ const m = r.hs - r.as; if (m === 0) return "push"; return (m > 0) === (L.side === "home") ? "win" : "loss"; }
  if (L.kind === "spread"){ const m = (L.side === "home" ? r.hs - r.as : r.as - r.hs) + L.line; return m > 0 ? "win" : m < 0 ? "loss" : "push"; }
  if (L.kind === "total"){ const s = r.hs + r.as; if (s === L.line) return "push"; return (s > L.line) === (L.side === "over") ? "win" : "loss"; }
  return null;
}
// Positive CLV = you beat the closing number
function legCLV(L){
  const r = findPlayed(L) || (RES[L.sport] ? RES[L.sport].rows.find(x => x.a === L.a && x.h === L.h && x.date === L.date) : null);
  if (!r) return null;
  if (L.kind === "spread" && r.sl != null && L.line != null){ const close = L.side === "home" ? -r.sl : r.sl; return { pts:+(L.line - close).toFixed(1), close }; }
  if (L.kind === "total" && r.tot != null && L.line != null){ return { pts:+(L.side === "over" ? r.tot - L.line : L.line - r.tot).toFixed(1), close:r.tot }; }
  if (L.kind === "ml"){ const c = L.side === "home" ? r.hml : r.aml; if (c != null) return { pct:imp(c)/imp(L.odds) - 1, close:c }; }
  return null;
}
function settleAll(){
  let changed = false;
  BETS.forEach(b => {
    if (b.status !== "open" || b.manualStatus) return;
    const outs = b.legs.map(legOutcome);
    if (outs.includes("loss")){ b.status = "loss"; b.profit = -b.stake; changed = true; return; }
    if (outs.some(o => o == null)) return;
    const d = b.legs.reduce((a,l,i) => a * (outs[i] === "win" ? dec(l.odds) : 1), 1);
    b.status = outs.every(o => o === "push") ? "push" : "win";
    b.profit = b.status === "push" ? 0 : +(b.stake * (d - 1)).toFixed(2);
    changed = true;
  });
  if (changed) saveBets();
}
function trackerStats(){
  const done = BETS.filter(b => b.status !== "open");
  const w = done.filter(b => b.status === "win").length, l = done.filter(b => b.status === "loss").length, p = done.filter(b => b.status === "push").length;
  const staked = done.reduce((a,b) => a + b.stake, 0), profit = done.reduce((a,b) => a + (b.profit || 0), 0);
  const clvs = BETS.flatMap(b => b.legs.length === 1 ? [legCLV(b.legs[0])] : []).filter(x => x && x.pts != null);
  const pctC = BETS.flatMap(b => b.legs.length === 1 ? [legCLV(b.legs[0])] : []).filter(x => x && x.pct != null);
  return { w, l, p, staked, profit, roi:staked ? profit/staked : null, open:BETS.filter(b => b.status === "open").length,
    clvPts:clvs.length ? clvs.reduce((a,x) => a + x.pts, 0)/clvs.length : null, beat:clvs.length ? clvs.filter(x => x.pts > 0).length : null, nClv:clvs.length,
    clvPct:pctC.length ? pctC.reduce((a,x) => a + x.pct, 0)/pctC.length : null };
}

/* ---------- Kalshi + Polymarket vs sportsbooks ---------- */
const kalshiFee = p => 0.07 * p * (1 - p);            // Kalshi's taker fee per $1 contract, approx.
const pmMid = x => !x ? null : (x.bid && x.ask ? (x.bid + x.ask) / 2 : x.last || null);
let mktSport = null;

function bookFair(sp, a, h, date){
  const L = LIVE_BY[sp];
  if (L && L.games){
    const g = L.games.find(x => x.awayAbbr === a && x.homeAbbr === h);
    const m = g && g.markets.find(x => x.type === "Moneyline");
    if (m){
      const fp = fairProbs(m);
      const best = i => { let v = null, bk = null; BOOKS.forEach(b => { const o = m.sides[i].odds[b]; if (o != null && (v == null || dec(o) > dec(v))){ v = o; bk = b; } }); return v == null ? null : { odds:v, book:bk }; };
      return { a:fp[0], h:fp[1], src:"live books", bestA:best(0), bestH:best(1) };
    }
  }
  const R = RES[sp], r = R && R.rows.find(x => x.a === a && x.h === h && Math.abs(dayNum(x.date) - dayNum(date)) <= 1 && x.hml != null && x.aml != null);
  if (r){ const pa = imp(r.aml), ph = imp(r.hml), t = pa + ph; return { a:pa/t, h:ph/t, src:R.lines ? "consensus line" : "ESPN line" }; }
  return null;
}

function ideas_push(sides, plan){ sides[0].ideas.unshift({ v:1, t:plan.t }); }
function marketRows(sp){
  const M = window.SLB && SLB.MARKETS && SLB.MARKETS[sp]; if (!M) return [];
  const today = etDate(new Date());
  return M.filter(r => r.date >= today).map(r => {
    const R = RES[sp], nm = ab => R ? R.name(ab) : ab, fair = bookFair(sp, r.a, r.h, r.date);
    const sides = ["a","h"].map(s => {
      const k = r.k && r.k[s], p = r.p && r.p.vol > 0 ? r.p[s] : null, f = fair ? fair[s] : null, ab = r[s];
      const kCost = k && k.ask ? k.ask + kalshiFee(k.ask) : null;
      const ideas = [];
      if (f != null && kCost != null && f - kCost >= 0.02) ideas.push({ v:f - kCost, t:`Buy ${nm(ab)} YES on Kalshi at ${Math.round(k.ask*100)}¢ (about ${Math.round(kCost*100)}¢ with fees). Books make it ${Math.round(f*100)}%.` });
      if (f != null && p != null && f - p >= 0.02) ideas.push({ v:f - p, t:`Buy ${nm(ab)} on Polymarket at ${Math.round(p*100)}¢. Books make it ${Math.round(f*100)}%.` });
      const pm = pmMid(k) ?? p, best = fair && (s === "a" ? fair.bestA : fair.bestH);
      if (pm != null && best){ const ev = pm*dec(best.odds) - 1; if (ev >= 0.02) ideas.push({ v:ev, t:`${nm(ab)} ${fmt(best.odds)} at ${BOOK_NAMES[best.book]} is ${pct(ev)} if the prediction markets are right (${Math.round(pm*100)}%).` }); }
      const km = pmMid(k);
      if (f == null && km != null && p != null && Math.abs(km - p) >= 0.05) ideas.push({ v:Math.abs(km - p) / 2, t:`Kalshi and Polymarket disagree on ${nm(ab)}: ${Math.round(km*100)}¢ vs ${Math.round(p*100)}¢. The cheaper side is worth a look.` });
      // what it actually costs to buy this side at each venue (Kalshi ask + fee, Polymarket ask when quoted)
      const pAsk = r.p && r.p.vol > 0 ? (r.p[s + "ask"] ?? null) : null;
      const venues = [];
      if (kCost != null) venues.push({ v:"Kalshi", px:k.ask, cost:kCost });
      if (p != null) venues.push({ v:"Polymarket", px:pAsk ?? p, cost:pAsk ?? p, approx:pAsk == null });
      const buy = venues.sort((x,y) => x.cost - y.cost)[0] || null;
      return { s, ab, name:nm(ab), k, p, f, ideas, buy };
    });
    // can you own BOTH sides for under $1? That's a locked profit (arbitrage).
    const [A, H] = sides, both = A.buy && H.buy ? A.buy.cost + H.buy.cost : null;
    let plan = null;
    if (both != null){
      const c1 = x => (Math.round(x*1000)/10) + "¢";
      const legs = `${A.name} on ${A.buy.v} at ${c1(A.buy.px)} + ${H.name} on ${H.buy.v} at ${c1(H.buy.px)}`;
      if (both < 0.995 && A.buy.v !== H.buy.v) plan = { arb:true, t:`Lock-in: buy ${legs}. With fees that’s ${(both*100).toFixed(1)}¢ for a contract that pays $1 whoever wins, about ${((1/both - 1)*100).toFixed(1)}% guaranteed${A.buy.approx || H.buy.approx ? " if the Polymarket price holds when you buy" : ""}.` };
      else plan = { arb:false, t:`Cheapest way to own both sides: ${legs}, ${(both*100).toFixed(1)}¢ total with fees. ${both >= 1 ? "That’s over $1, so there’s no locked profit here." : both >= 0.995 ? "That’s a hair under $1, too thin to survive fees and price moves." : `The ${A.buy.v} prices add up to under $1, which usually means one of them is out of date. Check the live price before acting.`}` };
      if (plan.arb) ideas_push(sides, plan);
    }
    return { ...r, sides, fair, plan, ideas:sides.flatMap(x => x.ideas).sort((x,y) => y.v - x.v), label:`${nm(r.a)} at ${nm(r.h)}` };
  });
}

/* ---------- Line-move alerts from the backend's hourly snapshots ---------- */
const MOVE_TH = { spread:{nfl:1.5,cfb:2,nba:2,ncaab:2.5}, total:{nfl:2,cfb:3,nba:3,ncaab:3,nhl:0.5,mlb:0.5}, prob:0.04, pm:0.05 };
const KEYNUM = [3,7];
let _moves = null;
function lineMoves(){
  if (_moves) return _moves;
  const H = window.SLB && SLB.HISTORY; if (!H) return _moves = [];
  const today = etDate(new Date()), out = [];
  for (const key in H){
    const [sp, date, a, h] = key.split("|"); if (date < today) continue;
    const arr = H[key]; if (arr.length < 2) continue;
    const R = RES[sp], nm = ab => R ? R.name(ab) : ab, game = `${nm(a)} at ${nm(h)}`;
    const first = i => arr.find(r => r[i] != null), last = i => [...arr].reverse().find(r => r[i] != null);
    const recentBase = i => { const L = last(i); return L && [...arr].reverse().find(r => r[i] != null && L[0] - r[0] >= 120); };
    const push = (type, text, size, r) => out.push({ sp, key, game, type, text, size, ts:r[0] });
    // spread (sl > 0 = home favored)
    const fs = first(1), ls = last(1), thS = MOVE_TH.spread[sp];
    if (thS && fs && ls && fs !== ls){
      const d = ls[1] - fs[1], hl = x => -x;
      const cross = ["nfl","cfb"].includes(sp) && KEYNUM.some(k => (Math.abs(fs[1]) - k) * (Math.abs(ls[1]) - k) < 0);
      if (Math.abs(d) >= thS || cross) push("spread", `${game}: spread moved ${d > 0 ? "toward " + nm(h) : "toward " + nm(a)}, ${nm(h)} ${fmtPt(hl(fs[1]))} → ${fmtPt(hl(ls[1]))}${cross ? " (crossed a key number)" : ""}`, Math.abs(d) + (cross ? 1 : 0), ls);
    }
    const ft = first(2), lt = last(2), thT = MOVE_TH.total[sp];
    if (thT && ft && lt && Math.abs(lt[2] - ft[2]) >= thT) push("total", `${game}: total ${lt[2] > ft[2] ? "up" : "down"} ${ft[2]} → ${lt[2]}`, Math.abs(lt[2] - ft[2]) / thT, lt);
    const fm = first(3), lm = last(3);
    if (fm && lm){ const d = imp(lm[3]) - imp(fm[3]); if (Math.abs(d) >= MOVE_TH.prob) push("ml", `${game}: ${nm(h)} moneyline ${fmt(fm[3])} → ${fmt(lm[3])} (${d > 0 ? "+" : ""}${Math.round(d*100)} pts)`, Math.abs(d) * 25, lm); }
    [[4,"Kalshi"],[5,"Polymarket"]].forEach(([i, src]) => {
      const f = first(i), l = last(i);
      if (f && l && f[i] !== 0.5 && l[i] !== 0.5 && Math.abs(l[i] - f[i]) >= MOVE_TH.pm) push("pm", `${game}: ${src} has ${nm(h)} ${Math.round(f[i]*100)}% → ${Math.round(l[i]*100)}%`, Math.abs(l[i] - f[i]) * 20, l);
    });
    // steam: a big chunk of the move in the last ~2 hours
    const rb = recentBase(1), lsr = last(1);
    if (thS && rb && lsr && Math.abs(lsr[1] - rb[1]) >= thS) out[out.length - 1] && (out.filter(x => x.key === key && x.type === "spread").forEach(x => x.steam = true));
  }
  return _moves = out.sort((a,b) => b.ts - a.ts || b.size - a.size);
}

/* ---------- System test: paper-traded picks made by the backend, graded after each game ---------- */
const STRAT_LABEL = { gap:"Market gap", steam:"Steam follow", angle:"Situational angle", dog:"Underdog of the day" };
function pickCLV(p){
  if (p.close == null) return null;
  if (p.mkt === "ml") return { pct:imp(p.close)/imp(p.odds) - 1 };
  if (p.mkt === "spread") return { pts:+(p.line - p.close).toFixed(1) };
  return { pts:+(p.side === "over" ? p.close - p.line : p.line - p.close).toFixed(1) };
}
function pickText(p){
  const [sp, , a, h] = p.key.split("|"), R = RES[sp], nm = ab => R ? R.name(ab) : ab;
  if (p.mkt === "ml") return `${nm(p.side === "home" ? h : a)} ML ${fmt(p.odds)}`;
  if (p.mkt === "spread") return `${nm(p.side === "home" ? h : a)} ${p.line === 0 ? "PK" : fmtPt(p.line)}`;
  return `${p.side === "over" ? "Over" : "Under"} ${p.line}`;
}
function tallyOf(list){
  const g = list.filter(p => p.result);
  const w = g.filter(p => p.result === "win").length, l = g.filter(p => p.result === "loss").length, ps = g.filter(p => p.result === "push").length;
  const u = g.reduce((a,p) => a + (p.units || 0), 0);
  const c = list.map(pickCLV).filter(x => x && x.pts != null);
  return { n:list.length, open:list.length - g.length, w, l, ps, u, roi:g.length ? u / g.length : null, clv:c.length ? c.reduce((a,x) => a + x.pts, 0)/c.length : null, beat:c.filter(x => x.pts > 0).length, nc:c.length };
}

  const list = [...P.picks].reverse().slice(0, sysOpen ? 200 : 8);

const SPORT_SHORT = { nba:"NBA", nhl:"NHL", nfl:"NFL", mlb:"MLB", cfb:"NCAAF", ncaab:"NCAAB", soccer:"Soccer", golf:"Golf" };
function topMoves(){
  if (!(window.SLB && SLB.HISTORY)) return null;
  const now = Date.now() / 60000;
  const rank = m => (m.steam ? 2 : 0) + (m.type === "pm" ? 0 : 1);   // sportsbook moves before prediction-market swings, which can be thin early
  const today = etDate(new Date());
  return lineMoves().filter(m => now - m.ts < 1440 && m.key.split("|")[1] === today).sort((a,b) => rank(b) - rank(a) || b.size - a.size).slice(0, 5);

function topAngles(){
  // one entry per game: up to 3 real closing-line angles, identical records merged ("last 10 and this season")

    const hs = resHighlights(g).filter(h => h.real);

/* ---------- Top suggested bet for one game ---------- */
function topBet(g){
  const R = RES[g.sport], date = etDate(g.start);
  const nm = ab => R ? R.name(ab) : ab;
  // 1. A system pick already logged for this game
  const P = window.SLB && SLB.PICKS;
  const order = { gap:0, dog:1, steam:2, angle:3 };
  const sys = P ? P.picks.filter(p => p.key === `${g.sport}|${date}|${g.awayAbbr}|${g.homeAbbr}`).sort((a,b) => (order[a.strat] ?? 9) - (order[b.strat] ?? 9))[0] : null;
  if (sys) return { bet:pickText(sys) + (sys.mkt === "ml" ? "" : ` (${fmt(sys.odds)})`), why:`${STRAT_LABEL[sys.strat]} pick${sys.why ? ": " + sys.why : sys.edge != null ? ": " + pct(sys.edge) + " edge" : sys.move != null ? ": line moved " + fmtPt(sys.move) : ""}`, src:"system" };
  // 2. A live price edge
  if (g.live){
    const e = allEdges(g.sport).filter(x => x.g.id === g.id)[0];
    if (e) return { bet:`${e.s.name} ${fmt(e.odds)} at ${BOOK_NAMES[e.book]}`, why:`${pct(e.ev)} better than the fair price of ${fmt(e.fair)}`, src:"edge" };
  }
  // 3. The strongest trend, turned into a bet at today's number
  if (!R) return null;
  const C = resCtx(g), row = C.row || {};
  for (const h of resHighlights(g)){
    if (!h.mkt) continue;
    if (h.mkt === "spread" && C.homeLine != null){
      const line = h.side === "home" ? C.homeLine : -C.homeLine;
      return { bet:`${nm(h.side === "home" ? g.homeAbbr : g.awayAbbr)} ${line === 0 ? "PK" : fmtPt(line)} (−110)`, why:h.t, src:"trend" };
    }
    if (h.mkt === "total" && C.tot != null) return { bet:`${h.side === "over" ? "Over" : "Under"} ${C.tot} (−110)`, why:h.t, src:"trend" };
    if (h.mkt === "ml"){
      const odds = h.side === "home" ? (row.hml ?? null) : (row.aml ?? null);
      if (odds != null && odds >= -200 && odds <= 200) return { bet:`${nm(h.side === "home" ? g.homeAbbr : g.awayAbbr)} ML ${fmt(odds)}`, why:h.t, src:"trend" };
    }
  }
  return { bet:"No position", why:"No price edge or strong trend for this game. Sitting it out is a position too.", src:"pass" };
}
function topBetHTML(g){
  const t = topBet(g); if (!t) return "";
  return `<div class="topbet ${t.src}"><small>Desk pick</small><b>${t.bet}</b><span>${t.why}</span></div>`;
}

};
function wxBucket(W){
  if (W.wind >= 15) return { name:"windy games (15+ mph)", test:(t, w) => w != null && w >= 15 };
  if (W.temp <= 40) return { name:"cold games (40°F or colder)", test:t => t <= 40 };
  if (W.temp >= 80) return { name:"hot games (80°F or warmer)", test:t => t >= 80 };
  return { name:"mild weather (41–79°F, light wind)", test:(t, w) => t > 40 && t < 80 && (w == null || w < 15) };
}
function wxRecord(R, ab, pick){
  let w = 0, l = 0, cw = 0, cl = 0, o = 0, u = 0;
  R.rows.forEach(x => {
    if (!x.played || (x.a !== ab && x.h !== ab) || !pick(x)) return;
    const home = x.h === ab, pf = home ? x.hs : x.as, pa = home ? x.as : x.hs;
    if (pf > pa) w++; else if (pf < pa) l++;
    if (x.sl != null){ const m = pf - pa + (home ? -x.sl : x.sl); if (m > 0) cw++; else if (m < 0) cl++; }
    if (x.tot != null){ const t = pf + pa; if (t > x.tot) o++; else if (t < x.tot) u++; }
  });
  return { w, l, cw, cl, o, u, n:w + l };
}
function wxBox(g){
  if (!["nfl","cfb"].includes(g.sport) || !window.SLB) return "";
  const R = RES[g.sport], row = R && resCtx(g).row;
  const W = SLB.WEATHER && SLB.WEATHER[g.sport + "|" + etDate(g.start) + "|" + g.awayAbbr + "|" + g.homeAbbr];
  const indoor = row && row.indoor === 1;
  if (!W && !indoor) return "";
  const kind = indoor ? "dome" : W.rain >= 50 ? (W.temp <= 34 ? "snow" : "rain") : W.rain >= 25 ? "cloud" : W.wind >= 15 ? "wind" : "sun";
  const label = { dome:"Indoors", snow:"Snow possible", rain:"Rain likely", cloud:"Clouds, some rain chance", wind:"Windy", sun:"Clear" }[kind];
  const detail = indoor ? "Played under a roof, so weather won’t be a factor." : `${label}, wind ${Math.round(W.wind)} mph, ${W.rain ?? 0}% chance of rain at kickoff.`;
  let hist = "";
  if (g.sport === "nfl"){
    const WX = SLB.NFL_WX || {}, B = indoor ? null : wxBucket(W);
    const pick = indoor ? (x => x.indoor === 1) : (x => { const k = WX[x.date + "|" + x.a + "|" + x.h]; return k && B.test(k[0], k[1]); });
    const rows = [[g.away, g.awayAbbr], [g.home, g.homeAbbr]].map(([nm, ab]) => ({ nm, r:wxRecord(R, ab, pick) }));
    hist = `<div class="wxhist"><small>In ${indoor ? "indoor games" : B.name}, since 2021</small>
      <table><thead><tr><th></th><th>Record</th><th>Spread</th><th>Over/under</th></tr></thead><tbody>
      ${rows.map(({ nm, r }) => r.n < 3 ? `<tr><td>${nm}</td><td colspan="3" class="mut">Too few games</td></tr>`
        : `<tr><td>${nm}</td><td class="num">${r.w}–${r.l}</td><td class="num">${r.cw}–${r.cl}</td><td class="num">${r.o}–${r.u}</td></tr>`).join("")}
      </tbody></table></div>`;
  } else hist = `<p class="wxnote">Weather history isn’t tracked for college games yet.</p>`;
  return `<div class="wxbox ${kind}"><div class="wxtop"><svg viewBox="0 0 24 24" aria-hidden="true">${WX_ICON[kind]}</svg>
    <div><b class="num">${indoor ? "Dome" : Math.round(W.temp) + "°F"}</b><span>${detail}</span></div></div>${hist}</div>`;
}

  const games = getGames(), confs = new Set();
  games.forEach(g => { [g.awayAbbr, g.homeAbbr].forEach(ab => CFB_CONF[ab] && confs.add(CFB_CONF[ab])); });
  const order = [...confs].sort((a,b) => (CFB_P4.indexOf(a) < 0 ? 9 : CFB_P4.indexOf(a)) - (CFB_P4.indexOf(b) < 0 ? 9 : CFB_P4.indexOf(b)) || a.localeCompare(b));
  const chip = (k, label) => `<button class="chip ${cfbFilt === k ? "on" : ""}" data-cf="${k}">${label}</button>`;
  const rk = window.SLB && SLB.CFB_RANK;
  return `<div class="filters cfbf" role="group" aria-label="Filter games">${chip("all", "All")}${chip("top25", "Top 25")}${order.map(c => chip(c, c)).join("")}</div>
    ${rk && rk.poll ? `<p class="note">Rankings: ${rk.poll}${rk.headline ? ", " + rk.headline.replace(rk.poll, "").replace(/^[\s:,-]+/, "") : ""}</p>` : ""}
    ${cfbFilt !== "all" && !oddsGames().length ? `<p class="note">No ${cfbFilt === "top25" ? "Top 25" : cfbFilt} games in this window.</p>` : ""}`;
}

function sparkSVG(arr){
  const w = 70, h = 22, min = Math.min(...arr), max = Math.max(...arr), r = (max-min)||1;
  const pts = arr.map((v,i) => (i*(w/(arr.length-1))).toFixed(1) + "," + (h - 2 - ((v-min)/r)*(h-4)).toFixed(1)).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function propLabel(p, side){ return p.p + " " + side.toLowerCase() + " " + p.line + " " + p.s.toLowerCase(); }

function histCell(label, rec, extra){
  if (!rec) return `<div class="na"><small>${label}</small><b>—</b></div>`;
  const r = rec[0]/rec[1];
  return `<div><small>${label}</small><b>${Math.round(r*100)}%</b><em>${rec[0]}/${rec[1]}${extra||""}</em><i class="${r<0.5?"low":""}" style="width:${Math.round(r*100)}%"></i></div>`;
}

function propDetail(p){
  const max = Math.max(...p.l10, p.line, 1) * 1.15, m = p.m;
  return `<div class="bars" aria-label="Last 10 games">
      ${p.l10.map(v => `<div class="bar ${v>p.line?"hit":""}" style="height:${Math.max(4,(v/max*100)).toFixed(0)}%"><span>${v}</span></div>`).join("")}
      <div class="lineMark" style="bottom:${(p.line/max*100).toFixed(0)}%"></div>
    </div>
    <div class="hist">
      ${histCell("Last 10", [p.hit10,10])}
      ${histCell("This season", p.ssn)}
      ${histCell("vs " + p.opp, [p.vs[0],p.vs[1]], ", avg " + p.vs[2])}
      ${histCell("Division games", p.div)}
      ${histCell(p.home ? "At home" : "On the road", p.loc)}
      ${histCell(p.rest[2], [p.rest[0],p.rest[1]])}
    </div>
    <div class="model">
      <span>Model <b>${(m.model*100).toFixed(0)}%</b></span>
      <span>Book implies <b>${(m.mkt*100).toFixed(0)}%</b></span>
      <span>Projection <b>${p.proj}</b></span>
    </div>
    <div class="prop-stats">
      <span>Over <b>${fmt(p.o)}</b> ${p.ob}</span>
      <span>Under <b>${fmt(p.u)}</b> ${p.ub}</span>
      <button class="add" data-add="Over">Add over</button>
      <button class="add" data-add="Under">Add under</button>
    </div>`;
}
function leanTag(m){
  if (!m.lean) return `<span class="ptag none">—</span>`;
  return `<span class="ptag ${m.lean.side==="Under"?"under":""}">${m.lean.side==="Over"?"O":"U"} ${pct(m.lean.ev)}</span>`;
}

let gameFilter = "all", teamFilter = "both", sortBy = "edge", openKey = null;

      <button class="chip ${gameFilter==="all"?"on":""}" data-game="all">All games</button>
      ${games.map(x => `<button class="chip ${gameFilter===x.id?"on":""}" data-game="${x.id}">${ABBR[x.away]} @ ${ABBR[x.home]}</button>`).join("")}
    </div>
    ${g ? `<div class="filters" role="group" aria-label="Team">

    <div class="filters" role="group" aria-label="Stat type">

    <div class="plist">
      <div class="phead"><span>Player</span><span>Line</span><span>L10</span><span>Season</span><span>Lean</span></div>
      ${list.map(p => { const k = PROPS_ALL[sport].indexOf(p); const open = openKey === k; return `
        <button class="prow ${open?"open":""}" data-k="${k}" aria-expanded="${open}">
